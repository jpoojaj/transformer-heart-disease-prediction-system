<!DOCTYPE html>
<!-- Standalone 3D heart viewer: minimal UI for embedding inside Streamlit -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0"
    />
    <title>3D Heart Viewer</title>
    <style>
      :root {
        color-scheme: dark;
        --accent: #ff5c7a;
        --accent-soft: #ff7c9f;
        --panel: rgba(15, 15, 26, 0.9);
        --panel-border: rgba(255, 255, 255, 0.12);
        --text-muted: rgba(255, 255, 255, 0.8);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Segoe UI", "Inter", sans-serif;
        background: radial-gradient(
            circle at 15% 15%,
            rgba(255, 160, 160, 0.85),
            rgba(150, 30, 50, 0.85)
          ),
          linear-gradient(145deg, rgba(255, 180, 180, 0.4), rgba(84, 27, 40, 0.75));
        color: #fff;
        overflow: hidden;
      }

      /* When controls=0 is passed from Streamlit, JS adds 'hide-viewer-ui' to
         documentElement/body. Hide HUD, annotation panel, and indicators then. */
      body.hide-viewer-ui #activate,
      body.hide-viewer-ui #annotation_panel,
      body.hide-viewer-ui .health-factor-indicator {
        display: none !important;
      }
      #heart-app {
        position: fixed;
        inset: 0;
      }
      #threeCanvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #activate {
        position: absolute;
        top: 32px;
        left: 24px;
        z-index: 10;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .hud-card {
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 14px;
        padding: 16px 18px;
        max-width: 320px;
        backdrop-filter: blur(8px);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
        font-size: 14px;
      }
      .control-card label {
        display: block;
        margin-bottom: 6px;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--text-muted);
      }
      .pill-select,
      .control-card input[type="range"] {
        width: 100%;
      }
      .pill-select {
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: rgba(0, 0, 0, 0.5);
        color: #fff;
        padding: 8px 12px;
      }
      .range-value {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: var(--text-muted);
        margin-top: 4px;
      }
      .toggle-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        margin-top: 14px;
        font-size: 13px;
      }
      .toggle-grid input {
        display: none;
      }
      .toggle-grid label {
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.05);
        cursor: pointer;
        color: var(--text-muted);
      }
      .toggle-grid input:checked + label {
        background: linear-gradient(135deg, var(--accent), var(--accent-soft));
        color: #fff;
        border-color: transparent;
      }
      .control-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 10px;
      }
      .button {
        background: linear-gradient(135deg, var(--accent), var(--accent-soft));
        border: none;
        color: #fff;
        padding: 10px 18px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45);
      }
      #risk_indicator {
        margin-top: 10px;
        font-size: 13px;
        color: var(--accent-soft);
      }
      .annotation-panel {
        position: absolute;
        top: 32px;
        right: 24px;
        width: 280px;
        max-width: 90vw;
        background: rgba(0, 0, 0, 0.8);
        border: 1px solid #ff5c5c;
        padding: 14px 16px;
        border-radius: 12px;
        z-index: 12;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
      }
      .annotation-panel.hidden {
        display: none;
      }
      .annotation-panel h3 {
        margin: 0 0 6px;
        font-size: 16px;
      }
      .annotation-panel p {
        margin: 4px 0;
        font-size: 13px;
      }
      .annotation-panel button {
        margin-top: 8px;
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.7);
        color: #fff;
        padding: 4px 8px;
        border-radius: 999px;
        cursor: pointer;
        font-size: 12px;
      }
      .health-factor-indicator {
        position: absolute;
        padding: 6px 10px;
        border-radius: 8px;
        font-size: 11px;
        font-weight: 600;
        z-index: 11;
        backdrop-filter: blur(4px);
        animation: pulse 2s infinite;
      }
      @keyframes pulse {
        0% {
          transform: scale(1);
          opacity: 0.9;
        }
        50% {
          transform: scale(1.05);
          opacity: 1;
        }
        100% {
          transform: scale(1);
          opacity: 0.9;
        }
      }
      .smoking-indicator {
        background: rgba(255, 0, 0, 0.3);
        border: 1px solid #ff0000;
        color: #ff9999;
        top: 20px;
        left: 20px;
      }
      .cholesterol-indicator {
        background: rgba(255, 255, 0, 0.3);
        border: 1px solid #ffff00;
        color: #ffff99;
        top: 60px;
        left: 20px;
      }
      .bp-indicator {
        background: rgba(0, 255, 255, 0.3);
        border: 1px solid #00ffff;
        color: #99ffff;
        top: 100px;
        left: 20px;
      }
      .alcohol-indicator {
        background: rgba(255, 0, 255, 0.3);
        border: 1px solid #ff00ff;
        color: #ff99ff;
        top: 140px;
        left: 20px;
      }
      .rhythm-indicator {
        background: rgba(0, 255, 0, 0.3);
        border: 1px solid #00ff00;
        color: #99ff99;
        top: 180px;
        left: 20px;
      }
    </style>
    <script>
      (function () {
        const params = new URLSearchParams(window.location.search || "");
        const toBool = (name, defaultVal = false) => {
          const v = params.get(name);
          if (v === null) return defaultVal;
          return v === "1" || v === "true";
        };
        const toNumber = (name, defaultVal = 0) => {
          const raw = params.get(name);
          if (raw == null) return defaultVal;
          const num = Number(raw);
          return Number.isFinite(num) ? num : defaultVal;
        };
        window.HEART_VIEWER_CONFIG = {
          state: params.get("state") || "healthy",
          progress: toNumber("progress", 0),
          smoking: toBool("smoking", false),
          bp: toBool("bp", false),
          cholesterol: toBool("cholesterol", false),
          alcohol: toBool("alcohol", false),
          exercise: toBool("exercise", true),
          bloodFlow: toBool("bloodFlow", false),
          realism: toBool("realism", false),
          rhythm: toBool("rhythm", true),
          model: params.get("model") || "closedheart",
          tour: toBool("tour", false),
        };
        if (params.get("controls") === "0") {
          document.documentElement.classList.add("hide-viewer-ui");
          document.addEventListener("DOMContentLoaded", () => {
            document.body.classList.add("hide-viewer-ui");
          });
        }
      })();
    </script>
  </head>
  <body>
    <div id="heart-app">
      <canvas id="threeCanvas"></canvas>
      <div id="activate">
        <div class="hud-card control-card">
          <label>Disease State</label>
          <select id="disease_state_select" class="pill-select">
            <option value="healthy">Healthy</option>
            <option value="atherosclerosis">Atherosclerosis</option>
            <option value="valve_stenosis">Valve Stenosis</option>
            <option value="myocardial_infarction">Myocardial Infarction</option>
          </select>
          <label style="margin-top: 16px;">Progression</label>
          <input type="range" id="progression_slider" min="0" max="100" value="0" />
          <div class="range-value"><span>0%</span><span>100%</span></div>
          <div class="toggle-grid">
            <input type="checkbox" id="factor_smoking" />
            <label for="factor_smoking">Smoking</label>
            <input type="checkbox" id="factor_bp" />
            <label for="factor_bp">High BP</label>
            <input type="checkbox" id="factor_cholesterol" />
            <label for="factor_cholesterol">Cholesterol</label>
            <input type="checkbox" id="factor_alcohol" />
            <label for="factor_alcohol">Alcohol</label>
            <input type="checkbox" id="factor_exercise" checked />
            <label for="factor_exercise">Exercise</label>
            <input type="checkbox" id="toggle_blood_flow" />
            <label for="toggle_blood_flow">Blood Flow</label>
            <input type="checkbox" id="toggle_realism" />
            <label for="toggle_realism">Realism</label>
            <input type="checkbox" id="toggle_rhythm" checked />
            <label for="toggle_rhythm">Rhythm</label>
          </div>
          <div id="risk_indicator">
            <div>Risk: <span id="risk_indicator_value">0%</span></div>
            <div
              id="risk_indicator_detail"
              style="font-size: 12px; margin-top: 4px; color: rgba(255, 255, 255, 0.7);"
            ></div>
          </div>
        </div>
        <div class="control-actions">
          <button id="move_heart_btn" class="button">Open/Close Heart</button>
          <button id="guided_tour_btn" class="button">Guided Tour</button>
          <button id="hide_dots_btn" class="button">Hide/Show Dots</button>
        </div>
      </div>
      <div id="annotation_panel" class="annotation-panel hidden">
        <h3 id="annotation_title">Focus Area</h3>
        <p id="annotation_description"></p>
        <p id="annotation_disease"></p>
        <button id="annotation_close">Close ␀d7</button>
      </div>
    </div>
    <script src="js/Tween.js"></script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
